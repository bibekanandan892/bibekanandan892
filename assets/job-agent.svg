<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 346" width="840" height="346" role="img" aria-label="AI Job Application Agent. A LangGraph pipeline: scout roles on LinkedIn and Greenhouse, score them, apply with a Playwright browser using a tailored resume and cover letter, then verify. A Next.js dashboard keeps a human in the loop. In progress.">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3a3c40"/></pattern>
<radialGradient id="glow" cx="0.5" cy="0.1" r="0.6"><stop offset="0" stop-color="#ff4e1b" stop-opacity="0.2"/><stop offset="1" stop-color="#ff4e1b" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="840" height="346" rx="18"/></clipPath>
<marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7a8085"/></marker>
</defs>
<g clip-path="url(#clip)">
<rect width="840" height="346" fill="#020305"/>
<rect width="840" height="346" fill="url(#dots)" opacity="0.55"/>
<rect width="840" height="346" fill="url(#glow)"/>
</g>
<rect x="0.5" y="0.5" width="839" height="345" rx="18" fill="none" stroke="#edf0f5" stroke-opacity="0.14"/>
<text class="m" x="40" y="50" font-size="12" fill="#ff4e1b" letter-spacing="2">02 · AUTONOMOUS AGENT</text><text class="s" x="40" y="86" font-size="26" fill="#edf0f5" font-weight="700">AI Job Application Agent</text><text class="s" x="40" y="112" font-size="15" fill="#a3aab2">Searches, ranks, and applies to roles, with a human in the loop.</text><rect x="679" y="32" width="121" height="28" rx="14" fill="#16181a" stroke="#ff4e1b" stroke-opacity="0.55"/><circle cx="695" cy="46" r="4" fill="#ff4e1b"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle><text class="m" x="707" y="50" font-size="12" fill="#edf0f5">in progress</text><rect x="40" y="144" width="160" height="60" rx="10" fill="#16181a" stroke="#2e2f31"/><text class="s" x="120.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">Scout</text><text class="m" x="120.0" y="189" font-size="11" fill="#7a8085" text-anchor="middle">LinkedIn, Greenhouse</text><rect x="240" y="144" width="160" height="60" rx="10" fill="#16181a" stroke="#2e2f31"/><text class="s" x="320.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">Score</text><text class="m" x="320.0" y="189" font-size="11" fill="#7a8085" text-anchor="middle">rank each role</text><line x1="205" y1="174.0" x2="235" y2="174.0" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><rect x="440" y="144" width="160" height="60" rx="10" fill="#16181a" stroke="#ff4e1b" stroke-width="1.5"/><text class="s" x="520.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">Apply</text><text class="m" x="520.0" y="189" font-size="11" fill="#ff4e1b" text-anchor="middle">Playwright browser</text><line x1="405" y1="174.0" x2="435" y2="174.0" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><rect x="640" y="144" width="160" height="60" rx="10" fill="#16181a" stroke="#2e2f31"/><text class="s" x="720.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">Verify</text><text class="m" x="720.0" y="189" font-size="11" fill="#7a8085" text-anchor="middle">confirm submission</text><line x1="605" y1="174.0" x2="635" y2="174.0" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><rect x="40" y="242" width="295" height="28" rx="14.0" fill="#16181a" stroke="#ff4e1b" stroke-dasharray="4 3"/><text class="m" x="187.5" y="260.2" font-size="12" fill="#edf0f5" text-anchor="middle">human in the loop · Next.js dashboard</text><rect x="390.0" y="242" width="134" height="28" rx="14.0" fill="#16181a" stroke="#2e2f31"/><text class="m" x="457.0" y="260.2" font-size="12" fill="#a3aab2" text-anchor="middle">tailored resume</text><rect x="538.0" y="242" width="112" height="28" rx="14.0" fill="#16181a" stroke="#2e2f31"/><text class="m" x="594.0" y="260.2" font-size="12" fill="#a3aab2" text-anchor="middle">cover letter</text><line x1="457.0" y1="224" x2="594.0" y2="224" stroke="#7a8085" stroke-width="1.3"/><line x1="457.0" y1="242" x2="457.0" y2="224" stroke="#7a8085" stroke-width="1.3"/><line x1="594.0" y1="242" x2="594.0" y2="224" stroke="#7a8085" stroke-width="1.3"/><line x1="520.0" y1="224" x2="520.0" y2="208" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><text class="s" x="800" y="256" font-size="22" fill="#ff4e1b" font-weight="700" text-anchor="end">LangGraph</text><text class="m" x="800" y="275" font-size="11" fill="#7a8085" text-anchor="end">SQLite checkpointer</text><line x1="40" y1="298" x2="800" y2="298" stroke="#2e2f31"/><text class="m" x="40" y="320" font-size="12" fill="#7a8085">Python  ·  LangGraph  ·  Playwright  ·  FastAPI  ·  Next.js  ·  Anthropic SDK  ·  Groq</text>
</svg>
