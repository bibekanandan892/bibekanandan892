<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 346" width="840" height="346" role="img" aria-label="VyaparPay Voice Support Agent. Pipeline: you speak over WebRTC, Deepgram speech to text, Claude as the LLM fed by screen context, typed tools and pgvector memory, streamed text to speech with barge-in. The screen is compressed from about 4,000 tokens to 300 or fewer. Live on a real device.">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
</style>
<defs>
