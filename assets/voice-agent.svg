<radialGradient id="glow" cx="0.82" cy="0.2" r="0.6"><stop offset="0" stop-color="#ff4e1b" stop-opacity="0.2"/><stop offset="1" stop-color="#ff4e1b" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="840" height="346" rx="18"/></clipPath>
<marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7a8085"/></marker>
</defs>
<g clip-path="url(#clip)">
<rect width="840" height="346" fill="#020305"/>
<rect width="840" height="346" fill="url(#dots)" opacity="0.55"/>
<rect width="840" height="346" fill="url(#glow)"/>
</g>
<rect x="0.5" y="0.5" width="839" height="345" rx="18" fill="none" stroke="#edf0f5" stroke-opacity="0.14"/>
<text class="m" x="40" y="50" font-size="12" fill="#ff4e1b" letter-spacing="2">01 · VOICE AGENT</text><text class="s" x="40" y="86" font-size="26" fill="#edf0f5" font-weight="700">VyaparPay Voice Support Agent</text><text class="s" x="40" y="112" font-size="15" fill="#a3aab2">A voice agent that sees your screen before you say a word.</text><rect x="606" y="32" width="194" height="28" rx="14" fill="#16181a" stroke="#ff4e1b" stroke-opacity="0.55"/><circle cx="622" cy="46" r="4" fill="#ff4e1b"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle><text class="m" x="634" y="50" font-size="12" fill="#edf0f5">live on a real device</text><rect x="40" y="144" width="132" height="60" rx="10" fill="#16181a" stroke="#2e2f31"/><text class="s" x="106.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">You speak</text><text class="m" x="106.0" y="189" font-size="11" fill="#7a8085" text-anchor="middle">WebRTC + VAD</text><rect x="197" y="144" width="132" height="60" rx="10" fill="#16181a" stroke="#2e2f31"/><text class="s" x="263.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">STT</text><text class="m" x="263.0" y="189" font-size="11" fill="#7a8085" text-anchor="middle">Deepgram</text><line x1="176" y1="174.0" x2="193" y2="174.0" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><rect x="354" y="144" width="132" height="60" rx="10" fill="#16181a" stroke="#ff4e1b" stroke-width="1.5"/><text class="s" x="420.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">LLM</text><text class="m" x="420.0" y="189" font-size="11" fill="#ff4e1b" text-anchor="middle">Claude</text><line x1="333" y1="174.0" x2="350" y2="174.0" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><rect x="511" y="144" width="132" height="60" rx="10" fill="#16181a" stroke="#2e2f31"/><text class="s" x="577.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">TTS</text><text class="m" x="577.0" y="189" font-size="11" fill="#7a8085" text-anchor="middle">streamed</text><line x1="490" y1="174.0" x2="507" y2="174.0" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><rect x="668" y="144" width="132" height="60" rx="10" fill="#16181a" stroke="#2e2f31"/><text class="s" x="734.0" y="170" font-size="15" fill="#edf0f5" font-weight="600" text-anchor="middle">Asha speaks</text><text class="m" x="734.0" y="189" font-size="11" fill="#7a8085" text-anchor="middle">with barge-in</text><line x1="647" y1="174.0" x2="664" y2="174.0" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><rect x="223.5" y="242" width="126" height="28" rx="14.0" fill="#16181a" stroke="#2e2f31"/><text class="m" x="286.5" y="260.2" font-size="12" fill="#a3aab2" text-anchor="middle">screen context</text><rect x="363.5" y="242" width="105" height="28" rx="14.0" fill="#16181a" stroke="#2e2f31"/><text class="m" x="416.0" y="260.2" font-size="12" fill="#a3aab2" text-anchor="middle">typed tools</text><rect x="482.5" y="242" width="134" height="28" rx="14.0" fill="#16181a" stroke="#2e2f31"/><text class="m" x="549.5" y="260.2" font-size="12" fill="#a3aab2" text-anchor="middle">pgvector memory</text><line x1="286.5" y1="224" x2="549.5" y2="224" stroke="#7a8085" stroke-width="1.3"/><line x1="286.5" y1="242" x2="286.5" y2="224" stroke="#7a8085" stroke-width="1.3"/><line x1="416.0" y1="242" x2="416.0" y2="224" stroke="#7a8085" stroke-width="1.3"/><line x1="549.5" y1="242" x2="549.5" y2="224" stroke="#7a8085" stroke-width="1.3"/><line x1="420.0" y1="224" x2="420.0" y2="208" stroke="#7a8085" stroke-width="1.3" marker-end="url(#arr)"/><text class="s" x="40" y="256" font-size="22" fill="#ff4e1b" font-weight="700" text-anchor="start">73</text><text class="m" x="40" y="275" font-size="11" fill="#7a8085" text-anchor="start">backend test files</text><text class="s" x="800" y="256" font-size="22" fill="#ff4e1b" font-weight="700" text-anchor="end">4,000 → ≤300</text><text class="m" x="800" y="275" font-size="11" fill="#7a8085" text-anchor="end">tokens per screen</text><line x1="40" y1="298" x2="800" y2="298" stroke="#2e2f31"/><text class="m" x="40" y="320" font-size="12" fill="#7a8085">Python  ·  FastAPI  ·  aiortc  ·  WebRTC  ·  pgvector  ·  Deepgram  ·  ElevenLabs  ·  OpenRouter</text>
</svg>
