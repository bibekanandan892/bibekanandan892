<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 364" width="840" height="364" role="img" aria-label="Memento and MemLayer. Write path: a conversation goes to an extractor LLM call, then a reconciler LLM call that decides add, update, delete or none against a vector store sharded per user. Facts are tagged semantic, episodic or procedural. Front ends: CLI, REST and an MCP server. 95% test coverage.">
