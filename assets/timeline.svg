<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 176" width="840" height="176" role="img" aria-label="Timeline. 2019 to 2022: B.Tech in Electronics and Telecommunication at VSSUT, Odisha. 2022 to 2025: iServeU, fintech apps for micro-banking networks. 2025 to now: Software Engineer I at Swiggy. 2026: applied AI, three agent projects and 188 posts on AI.">
